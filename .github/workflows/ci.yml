name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install
      - name: Copy audit
        run: node scripts/audit-ui-copy.mjs
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Test
        run: pnpm test
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm exec playwright test

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Ingest dry-run (demo IQ fixture)
        run: python -m hightail.cli ingest --dry-run --estimates ../data/fixtures/demo_estimates.csv --scale iq
      - name: Ingest dry-run (PISA 2022)
        run: python -m hightail.cli ingest --dry-run --estimates ../data/fixtures/pisa_2022_math.csv --scale pisa
      - name: Build PISA atlas
        run: python -m hightail.cli build --estimates ../data/fixtures/pisa_2022_math.csv --population ../data/raw/wpp_extract.csv --overrides ../data/overrides/iso3_overrides.yaml --policy ../data/overrides/territory_policy.yaml --out ../web/public/data/atlas.json --reference-year 2025 --scale pisa

  static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline
        working-directory: pipeline
        run: python -m pip install -e .
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install
      - name: Pipeline
        run: pnpm pipeline
      - name: Build static export
        run: pnpm build
      - name: Size budgets
        run: pnpm check:sizes
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright static export at /
        run: pnpm test:e2e:static
      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: web/out
          if-no-files-found: error
      # Project-pages prefix: next.config.ts reads NEXT_PUBLIC_BASE_PATH; it does not set it.
      - name: Build static export for project pages
        env:
          NEXT_PUBLIC_BASE_PATH: /high-tail-atlas
        run: pnpm build
      - name: Playwright static export at /high-tail-atlas/
        env:
          PLAYWRIGHT_BASE_PATH: /high-tail-atlas
          PLAYWRIGHT_PORT: "4174"
        run: pnpm test:e2e:static
      - name: Upload project-pages export
        uses: actions/upload-artifact@v4
        with:
          name: static-site-project-pages
          path: web/out
          if-no-files-found: error

  # Manual deploy only (Settings → Pages → GitHub Actions). See README hosting notes.
  deploy-pages:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [web, pipeline, static]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-site-project-pages
          path: _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
