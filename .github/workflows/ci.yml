name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Test
        run: pnpm test

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Ingest dry-run
        run: python -m hightail.cli ingest --dry-run --estimates ../data/fixtures/demo_estimates.csv
      - name: Build demo atlas
        run: python -m hightail.cli build --estimates ../data/fixtures/demo_estimates.csv --population ../data/raw/wpp_extract.csv --overrides ../data/overrides/iso3_overrides.yaml --policy ../data/overrides/territory_policy.yaml --out $RUNNER_TEMP/atlas.json --reference-year 2025
